<!DOCTYPE html>
<html>
<head>
<title>KFC Online</title>
<link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
<script>
function OrderClick(){
document.getElementById("lblName").innerHTML=document.getElementById("txtName").value;
document.getElementById("lblMobile").innerHTML=document.getElementById("txtMobile").value;

var mname="";
var mcost;
var adonname="";
var adoncost;
var total;

var optBurger = document.getElementById("optBurger");
var optRoller = document.getElementById("optRoller");
var optWings = document.getElementById("optWings");
var optPopcorn = document.getElementById("optPopcorn");

if(optBurger.checked){
mname = optBurger.value;
mcost = 120;
}
if(optRoller.checked){
mname = optRoller.value;
mcost = 140;
}
if(optWings.checked){
adonname += optWings.value + "<br>";
adoncost = 40;
mcost = mcost + adoncost;
}
if(optPopcorn.checked){
adonname += optPopcorn.value + "<br>";
adoncost = 80;
mcost = mcost + adoncost;
}
total = mcost;

document.getElementById("lblMeal").innerHTML = mname;
document.getElementById("lblAdon").innerHTML = adonname;
document.getElementById("lblTotal").innerHTML = total;
}
</script>
</head>
<body class="container-fluid">
<header>
<img src="../assets/images/kfc-top.jpg" width="100%" height="300px">
</header>
<section >
<div class="accordion" id="kfcform">
<div class="accordion-item">
<h2 class="accordion-header">
<button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#customerinfo">
Customer Info
</button>
</h2>
</div>
<div class="accordion-collapse collapse show" id="customerinfo">
<div class="accordion-body">
<dl>
<dt>Customer Name : </dt>
<dd>
<input type="text" id="txtName" class="form-control">
</dd>
<dt>Mobile No. : </dt>
<dd>
<input type="text" id="txtMobile" class="form-control">
</dd>
</dl>
</div>
</div>

<!-- Second Item -->
<div class="accordion-item">
<h2 class="accordion-header">
<button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#mealinfo">
Select Your Meal
</button>
</h2>
</div>
<div class="accordion-collapse collapse" id="mealinfo">
<div class="accordion-body">
<div class="row">
<div class="col">
<div class="card">
<div class="card-header">
<h3>OMG Burger</h3>
</div>
<div class="card-body">
<img src="../assets/images/kfc-burger.jpg" width="200" height="200">
</div>
<div class="card-footer">
<input type="radio" id="optBurger" value="OMG Burger" name="meal"> &#8377; 120/-
</div>
</div>
</div>
<div class="col">
<div class="card">
<div class="card-header">
<h3>KFC Roller</h3>
</div>
<div class="card-body">
<img src="../assets/images/kfc-roller.jpg" width="200" height="200">
</div>
<div class="card-footer">
<input type="radio" id="optRoller" value="KFC Roller" name="meal"> &#8377; 140/-
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Third Item -->
<div class="accordion-item">
<h2 class="accordion-header">
<button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#adoninfo">
Select Ad-ONs
</button>
</h2>
</div>
<div class="accordion-collapse collapse" id="adoninfo">
<div class="accordion-body">
<div class="row">
<div class="col">
<div class="card">
<div class="card-header">
<h3>Hot Wings</h3>
</div>
<div class="card-body">
<img src="../assets/images/kfc-wings.jpg" width="200" height="200">
</div>
<div class="card-footer">
<input type="checkbox" id="optWings" value="Hot Wings"> &#8377; 40/-
</div>
</div>
</div>
<div class="col">
<div class="card">
<div class="card-header">
<h3>KFC Popcorn</h3>
</div>
<div class="card-body">
<img src="../assets/images/kfc-popcorn.jpg" width="200" height="200">
</div>
<div class="card-footer">
<div class="form-check form-switch">
<input class="form-check-input" type="checkbox" id="optPopcorn" value="KFC Popcorn"> &#8377; 80/-
</div>

</div>
</div>
</div>
</div>
</div>
</div>
<div class="d-grid">
<button onclick="OrderClick()" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#summary">Place Order</button>
</div>
<div class="modal fade" id="summary">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h2>Bill Summary</h2>
</div>
<div class="modal-body">
<table class="table table-hover">
<tr>
<td>Customer Name : </td>
<td id="lblName"></td>
</tr>
<tr>
<td>Mobile No. : </td>
<td id="lblMobile"></td>
</tr>
<tr>
<td>Meal : </td>
<td id="lblMeal"></td>
</tr>
<tr>
<td>Ad-ONs : </td>
<td id="lblAdon"></td>
</tr>
<tr>
<td>Total Amount : </td>
<td id="lblTotal"></td>
</tr>
</table>
</div>
<div class="modal-footer">
<button data-bs-dismiss="modal" class="btn btn-primary">OK</button>
</div>
</div>
</div>
</div>
</div>
</section>
<script src="../node_modules/jquery/dist/jquery.js"></script>
<script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</body>
</html>
