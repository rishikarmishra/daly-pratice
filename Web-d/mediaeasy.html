<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Responsive Page</title>
    <style>
        /* Basic Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header, footer {
            background-color: #2196F3;
            color: white;
            text-align: center;
            padding: 10px;
        }

        main {
            padding: 10px;
        }

        /* Responsive Media Query */
        @media (max-width: 600px) {
            header, footer, main {
                padding: 5px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Page</h1>
    </header>
    <main>
        <p>This is some simple content. The page adjusts on small screens!</p>
    </main>
    <footer>
        <p>&copy; 2024 My Page</p>
    </footer>
</body>
</html>
