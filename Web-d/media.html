<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <style>
        /* Basic Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header, footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
        }

        main {
            flex: 1;
            background-color: #f4f4f4;
            padding: 15px;
            margin: 10px;
        }

        aside {
            flex: 0 0 25%;
            background-color: #ccc;
            padding: 15px;
            margin: 10px;
        }

        footer {
            margin-top: 20px;
        }

        /* Media Query for Mobile Devices */
        @media (max-width: 768px) {
            aside {
                flex: 1 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Responsive Website</h1>
    </header>
    <div class="container">
        <main>
            <h2>Main Content</h2>
            <p>This is the main content area. On smaller screens, the sidebar will move below this content.</p>
        </main>
        <aside>
            <h2>Sidebar</h2>
            <p>This is the sidebar content.</p>
        </aside>
    </div>
    <footer>
        <p>&copy; 2024 Responsive Website</p>
    </footer>
</body>
</html>
